# Dependency and GitHub Actions updates. Every update is a pull request that
# follows AI.md and CONTRIBUTING.md ("Dependencies") like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # yanked one is usually caught first. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Only this label; Dependabot's per-ecosystem defaults are not used.
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # yanked one is usually caught first. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Only this label; Dependabot's per-ecosystem defaults are not used.
    labels: ["dependencies"]
